<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="820" height="300" fill="#ffffff"/>

  <!-- Sender -->
  <rect x="20" y="150" width="190" height="110" rx="10" fill="#e8f1fb" stroke="#2c6fb7" stroke-width="2"/>
  <text x="115" y="176" text-anchor="middle" font-weight="bold" fill="#1d4f86">Source agent</text>
  <text x="115" y="196" text-anchor="middle" fill="#1d4f86">on computer A</text>
  <!-- clock icon -->
  <circle cx="60" cy="230" r="18" fill="#fff" stroke="#2c6fb7" stroke-width="2"/>
  <line x1="60" y1="230" x2="60" y2="218" stroke="#2c6fb7" stroke-width="2"/>
  <line x1="60" y1="230" x2="69" y2="235" stroke="#2c6fb7" stroke-width="2"/>
  <text x="86" y="226" fill="#1d4f86" font-size="12">clock of</text>
  <text x="86" y="242" fill="#1d4f86" font-size="12">computer A</text>

  <!-- Broker -->
  <rect x="330" y="170" width="160" height="70" rx="10" fill="#f2f2f2" stroke="#777" stroke-width="2"/>
  <text x="410" y="200" text-anchor="middle" font-weight="bold" fill="#333">Broker</text>
  <text x="410" y="220" text-anchor="middle" fill="#555" font-size="12">forwards, does not touch</text>

  <!-- Logger -->
  <rect x="610" y="170" width="190" height="70" rx="10" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="705" y="200" text-anchor="middle" font-weight="bold" fill="#1f5f3b">Logger</text>
  <text x="705" y="220" text-anchor="middle" fill="#1f5f3b" font-size="12">MongoDB / HDF5 / bag</text>

  <!-- arrows -->
  <line x1="212" y1="205" x2="326" y2="205" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="492" y1="205" x2="606" y2="205" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- message card -->
  <rect x="215" y="18" width="390" height="118" rx="8" fill="#fffbe6" stroke="#c9a227" stroke-width="1.5"/>
  <text x="230" y="40" font-family="Menlo, Consolas, monospace" font-size="13" fill="#333">{</text>
  <text x="245" y="58" font-family="Menlo, Consolas, monospace" font-size="13" fill="#333">"data": { "T": 21.4 },</text>
  <text x="245" y="76" font-family="Menlo, Consolas, monospace" font-size="13" fill="#b03a2e">"timestamp": "2025-07-11T10:53:18.716+0200",</text>
  <text x="245" y="94" font-family="Menlo, Consolas, monospace" font-size="13" fill="#b03a2e">"timecode": 39198.68,</text>
  <text x="245" y="112" font-family="Menlo, Consolas, monospace" font-size="13" fill="#b03a2e">"hostname": "computer-A"</text>
  <text x="230" y="130" font-family="Menlo, Consolas, monospace" font-size="13" fill="#333">}</text>
  <line x1="115" y1="148" x2="240" y2="100" stroke="#b03a2e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="20" y="100" fill="#b03a2e" font-size="12">added when the</text>
  <text x="20" y="116" fill="#b03a2e" font-size="12">message is sent</text>

  <text x="410" y="285" text-anchor="middle" fill="#555" font-size="13" font-style="italic">The time written in the message always comes from the clock of the computer that sent it.</text>
</svg>
