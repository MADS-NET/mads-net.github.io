<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="820" height="390" fill="#ffffff"/>

  <!-- headers -->
  <rect x="80" y="20" width="160" height="44" rx="8" fill="#e8f1fb" stroke="#2c6fb7" stroke-width="2"/>
  <text x="160" y="40" text-anchor="middle" font-weight="bold" fill="#1d4f86">Agent</text>
  <text x="160" y="56" text-anchor="middle" fill="#1d4f86" font-size="12">reads its own clock</text>
  <rect x="400" y="20" width="160" height="44" rx="8" fill="#f2f2f2" stroke="#777" stroke-width="2"/>
  <text x="480" y="40" text-anchor="middle" font-weight="bold" fill="#333">Broker</text>
  <text x="480" y="56" text-anchor="middle" fill="#555" font-size="12">reads its own clock</text>

  <!-- lifelines -->
  <line x1="160" y1="66" x2="160" y2="330" stroke="#2c6fb7" stroke-width="2"/>
  <line x1="480" y1="66" x2="480" y2="330" stroke="#777" stroke-width="2"/>
  <text x="30" y="330" fill="#999" font-size="12">time ↓</text>

  <!-- request -->
  <circle cx="160" cy="110" r="5" fill="#2c6fb7"/>
  <text x="148" y="115" text-anchor="end" fill="#1d4f86" font-weight="bold">t1</text>
  <text x="148" y="131" text-anchor="end" fill="#1d4f86" font-size="12">"what time is it?"</text>
  <line x1="165" y1="112" x2="474" y2="168" stroke="#333" stroke-width="2" marker-end="url(#arr3)"/>
  <circle cx="480" cy="170" r="5" fill="#777"/>
  <text x="492" y="175" fill="#333" font-weight="bold">t2</text>
  <text x="520" y="175" fill="#555" font-size="12">request arrives</text>

  <!-- reply -->
  <circle cx="480" cy="210" r="5" fill="#777"/>
  <text x="492" y="215" fill="#333" font-weight="bold">t3</text>
  <text x="520" y="215" fill="#555" font-size="12">reply leaves (with t2 and t3)</text>
  <line x1="475" y1="212" x2="166" y2="268" stroke="#333" stroke-width="2" marker-end="url(#arr3)"/>
  <circle cx="160" cy="270" r="5" fill="#2c6fb7"/>
  <text x="148" y="275" text-anchor="end" fill="#1d4f86" font-weight="bold">t4</text>
  <text x="148" y="291" text-anchor="end" fill="#1d4f86" font-size="12">reply received</text>

  <!-- explanation box -->
  <rect x="560" y="250" width="245" height="120" rx="8" fill="#fffbe6" stroke="#c9a227" stroke-width="1.5"/>
  <text x="572" y="272" font-weight="bold" fill="#333" font-size="13">The agent now knows:</text>
  <text x="572" y="294" fill="#333" font-size="12">• how long the trip took,</text>
  <text x="584" y="310" fill="#333" font-size="12">minus the broker's own work</text>
  <text x="572" y="332" fill="#333" font-size="12">• how far apart the two clocks</text>
  <text x="584" y="348" fill="#333" font-size="12">are, assuming the trip there and</text>
  <text x="584" y="364" fill="#333" font-size="12">the trip back take the same time</text>

  <text x="320" y="360" text-anchor="middle" fill="#555" font-size="13" font-style="italic">Repeated 5 times: the fastest round trip gives the most trustworthy answer.</text>
</svg>
