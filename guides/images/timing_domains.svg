<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arr4g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
    </marker>
  </defs>
  <rect width="820" height="420" fill="#ffffff"/>

  <!-- broker host -->
  <rect x="290" y="20" width="240" height="80" rx="10" fill="#f2f2f2" stroke="#777" stroke-width="2"/>
  <text x="410" y="48" text-anchor="middle" font-weight="bold" fill="#333">Broker computer</text>
  <text x="410" y="68" text-anchor="middle" fill="#555" font-size="13">its clock is the reference</text>
  <text x="410" y="86" text-anchor="middle" fill="#555" font-size="12">(ideally kept on time by NTP)</text>

  <!-- domain 1 -->
  <rect x="20" y="180" width="380" height="200" rx="12" fill="#f7fbff" stroke="#2c6fb7" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="35" y="203" font-weight="bold" fill="#1d4f86">Raspberry Pi</text>
  <text x="385" y="203" text-anchor="end" fill="#1d4f86" font-size="12">one clock domain</text>

  <g>
    <rect x="35" y="250" width="110" height="60" rx="8" fill="#e8f1fb" stroke="#2c6fb7" stroke-width="1.5"/>
    <text x="90" y="274" text-anchor="middle" fill="#1d4f86" font-size="13" font-weight="bold">sensor_1</text>
    <text x="90" y="294" text-anchor="middle" fill="#b03a2e" font-size="13">+42.0 ms</text>
    <rect x="155" y="250" width="110" height="60" rx="8" fill="#e8f1fb" stroke="#2c6fb7" stroke-width="1.5"/>
    <text x="210" y="274" text-anchor="middle" fill="#1d4f86" font-size="13" font-weight="bold">sensor_2</text>
    <text x="210" y="294" text-anchor="middle" fill="#b03a2e" font-size="13">+42.0 ms</text>
    <rect x="275" y="250" width="110" height="60" rx="8" fill="#e8f1fb" stroke="#2c6fb7" stroke-width="1.5"/>
    <text x="330" y="274" text-anchor="middle" fill="#1d4f86" font-size="13" font-weight="bold">filter</text>
    <text x="330" y="294" text-anchor="middle" fill="#b03a2e" font-size="13">+42.0 ms</text>
  </g>
  <!-- share arrows domain 1 -->
  <path d="M100,312 C110,350 200,350 205,314" fill="none" stroke="#2e8b57" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr4g)"/>
  <path d="M110,312 C130,372 320,372 325,314" fill="none" stroke="#2e8b57" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr4g)"/>
  <text x="210" y="370" text-anchor="middle" fill="#2e8b57" font-size="12">shares its result</text>

  <!-- measure arrow domain 1 -->
  <line x1="90" y1="248" x2="300" y2="103" stroke="#333" stroke-width="2" marker-start="url(#arr4)" marker-end="url(#arr4)"/>
  <text x="120" y="160" fill="#333" font-size="12">measures</text>

  <!-- domain 2 -->
  <rect x="440" y="180" width="360" height="200" rx="12" fill="#f7fbf8" stroke="#2e8b57" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="455" y="203" font-weight="bold" fill="#1f5f3b">Workstation</text>
  <text x="785" y="203" text-anchor="end" fill="#1f5f3b" font-size="12">another clock domain</text>
  <rect x="470" y="250" width="130" height="60" rx="8" fill="#eaf6ec" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="535" y="274" text-anchor="middle" fill="#1f5f3b" font-size="13" font-weight="bold">logger</text>
  <text x="535" y="294" text-anchor="middle" fill="#b03a2e" font-size="13">−3.1 ms</text>
  <rect x="640" y="250" width="130" height="60" rx="8" fill="#eaf6ec" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="705" y="274" text-anchor="middle" fill="#1f5f3b" font-size="13" font-weight="bold">controller</text>
  <text x="705" y="294" text-anchor="middle" fill="#b03a2e" font-size="13">−3.1 ms</text>
  <path d="M545,312 C560,355 690,355 700,314" fill="none" stroke="#2e8b57" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr4g)"/>
  <text x="620" y="366" text-anchor="middle" fill="#2e8b57" font-size="12">shares its result</text>
  <line x1="570" y1="248" x2="525" y2="103" stroke="#333" stroke-width="2" marker-start="url(#arr4)" marker-end="url(#arr4)"/>
  <text x="565" y="160" fill="#333" font-size="12">measures</text>

  <text x="410" y="408" text-anchor="middle" fill="#555" font-size="13" font-style="italic">Agents on the same computer read the same clock, so they share one measurement and one offset.</text>
</svg>
